<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'"><title>SysMonitor 进程管理</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101722;color:#e3ebf6;font:14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif}header{padding:22px 26px 14px;border-bottom:1px solid #2a374a}h1{font-size:24px;margin:0 0 5px}p{margin:5px 0;color:#a7b7cd}.toolbar{display:flex;gap:12px;padding:16px 26px;align-items:center}input,select,button{font:inherit;border:1px solid #40516a;background:#1a2638;color:inherit;border-radius:7px;padding:9px 12px}input{width:310px}button{cursor:pointer}button:hover{background:#293d58}button:disabled{opacity:.45;cursor:default}.table-wrap{margin:0 26px;border:1px solid #2a374a;border-radius:10px;max-height:360px;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:10px 12px;border-bottom:1px solid #253246}th{position:sticky;top:0;background:#1b293c;color:#afc4df;font-weight:500}th:first-child,td:first-child{text-align:left}th button{padding:0;border:0;background:none;font-size:12px}td:first-child button{padding:0;border:0;background:none;color:#83b9ff;max-width:230px;overflow:hidden;text-overflow:ellipsis}tr.selected{background:#213958}tbody tr:hover{background:#1c2c42}.details{margin:18px 26px;padding:17px 20px;background:#182436;border:1px solid #2a374a;border-radius:10px}.details h2{font-size:17px;margin:0 0 9px}#detailText{white-space:pre-wrap;overflow-wrap:anywhere;color:#b7c6d9;max-height:145px;overflow:auto}.actions{display:flex;gap:10px;margin-top:13px}.danger{color:#ffb4b4;border-color:#805158}#message{padding:0 26px 18px;color:#e7c68b;white-space:pre-wrap}#source{font-size:12px;max-width:1050px}#count{margin-left:auto;color:#a7b7cd;font-size:12px}small{color:#a7b7cd}footer{padding:0 26px 15px;font-size:12px;color:#8197b3}
</style></head><body><header><h1>进程管理</h1><p>找到占用资源的进程，查看详情并执行单进程操作。</p><p id="source">正在连接进程采集器…</p></header>
<div class="toolbar"><input id="search" placeholder="搜索进程名或 PID" aria-label="搜索进程名或 PID"><select id="sort" aria-label="排序指标"><option value="cpu">CPU</option><option value="mem">内存</option><option value="gpu">GPU</option><option value="vram">专用显存</option><option value="net">网络总速率</option><option value="io">I/O 总速率</option></select><button id="direction">从高到低 ↓</button><span id="count"></span></div>
<div class="table-wrap"><table><thead><tr><th>进程 / 查看详情</th><th>PID</th><th>CPU</th><th>内存工作集</th><th>GPU / 引擎</th><th>专用显存</th><th>下载 ↓</th><th>上传 ↑</th><th>I/O</th></tr></thead><tbody id="rows"></tbody></table></div>
<section class="details"><h2 id="detailTitle">选择一个进程</h2><div id="detailText">点击进程名称查看路径、启动时间、优先级和当前指标。</div><div class="actions"><button id="location" disabled>打开文件位置</button><button id="terminate" class="danger" disabled>结束此进程</button></div></section><div id="message" role="status"></div>
<footer>GPU 使用最忙引擎占用率；内存为工作集，可能包含共享页。I/O 包括文件、网络和设备操作，不等于纯磁盘吞吐。结束操作会再次核对进程身份并要求确认。</footer><script src="process-manager.js"></script></body></html>
